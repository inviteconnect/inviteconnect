# Render Blueprint. Render reads this file from your GitHub repository.
# Create your PostgreSQL database in Render first (see README.md), then enter its Internal Database URL
# when Render asks for DATABASE_URL.
services:
  - type: web
    name: file-share
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: DATABASE_URL
        sync: false
